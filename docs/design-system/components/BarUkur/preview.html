<!doctype html>
<html>
<head><meta charset="utf-8"><title>Bar ukur</title></head>
<body>
<div class="eg-demo" style="display:grid;grid-template-columns:1fr 1fr;gap:28px 40px">
  <div><div class="eg-bar-baris"><span>CAHAYA</span><b>62%</b></div><div class="eg-bar"><i style="width:62%;--isi:var(--sda-matahari)"></i></div></div>
  <div><div class="eg-bar-baris"><span>WAKTU</span><b>11 dtk</b></div><div class="eg-bar eg-bar--tipis"><i style="width:73%"></i></div></div>
  <div><div class="eg-bar-baris"><span>WAKTU · TERBURU</span><b>4 dtk</b></div><div class="eg-bar eg-bar--tipis"><i style="width:26%;--isi:var(--stempel)"></i></div></div>
  <div><div class="eg-bar-baris"><span>DRUM MINYAK</span><b>70%</b></div><div class="eg-bar eg-bar--tebal"><i style="width:70%;--isi:var(--sda-minyak)"></i></div></div>
  <div><div class="eg-bar-baris"><span>DOSIS · AMAN</span><b>48%</b></div><div class="eg-bar"><i style="width:48%;--isi:var(--oker)"></i></div></div>
  <div><div class="eg-bar-baris"><span>DOSIS · BAHAYA</span><b>84%</b></div><div class="eg-bar"><i style="width:84%;--isi:var(--stempel)"></i></div></div>
</div>
</body>
</html>
