<!doctype html>
<html>
<head><meta charset="utf-8"><title>Radar</title></head>
<body>
<div class="eg-peta" style="display:flex;gap:48px;padding:32px 40px;align-items:center">

    <div class="eg-radar__cincin" style="width:267px;height:267px"></div>
    <span class="eg-radar__label" style="left:140px;top:206px">50 m</span>
    <span class="eg-radar__label" style="left:72px;top:206px">100 m</span>
    <span class="eg-radar__arah u" style="left:111px;top:46px">U</span>
    <span class="eg-radar__arah" style="left:354px;top:111px">T</span>
    <span class="eg-radar__arah" style="left:289px;top:354px">S</span>

    <div class="eg-node" style="left:286px;top:72px"><img src="../../assets/Ikon/sda-minyak.svg" alt="Minyak Bumi"></div>
    <div class="eg-node is-langka" style="left:92px;top:130px"><img src="../../assets/Ikon/sda-uranium.svg" alt="Uranium"></div>
    <div class="eg-node is-terkunci" style="left:200px;top:340px"><img src="../../assets/Ikon/sda-emas.svg" alt="Terkunci"></div>
    <div class="eg-radar__pemain"></div>
  </div>
  <div class="eg-kolom" style="gap:14px;font-size:16px;line-height:22px;max-width:380px">
    <div class="eg-baris"><div class="eg-node is-dekat is-terpilih" style="position:relative;margin:4px 10px 4px 4px"><img src="../../assets/Ikon/sda-matahari.svg" alt=""></div>dalam jangkauan + terpilih: cincin oranye dan cincin tinta</div>
    <div class="eg-baris"><div class="eg-node" style="position:relative;margin:0 10px 0 0"><img src="../../assets/Ikon/sda-emas.svg" alt=""></div>di luar jangkauan</div>
    <div class="eg-baris"><div class="eg-node is-langka" style="position:relative;margin:0 10px 0 0"><img src="../../assets/Ikon/sda-uranium.svg" alt=""></div>uranium: cahaya hijau berdenyut (langka)</div>
    <div class="eg-baris"><div class="eg-node is-terkunci" style="position:relative;margin:0 10px 0 0"><img src="../../assets/Ikon/sda-emas.svg" alt=""></div>terkunci: garis putus, ikon pudar</div>
  </div>
