<!doctype html>
<html>
<head><meta charset="utf-8"><title>Kartu soal</title></head>
<body>
<div class="eg-peta" style="display:flex;gap:56px;padding:40px 48px">
  <div class="eg-soal-tumpuk">
    <div class="eg-kartu eg-soal">
      <div class="eg-soal__waktu"><img src="../../assets/Ikon/jam.svg" alt=""><div class="eg-bar eg-bar--tipis eg-isi"><i style="width:66%"></i></div><b class="eg-data">10</b></div>
      <img src="../../assets/Ikon/sda-batubara.svg" alt="" width="56" height="56" style="margin:18px auto 12px">
      <p class="eg-soal__teks">Batu bara terbentuk dari sisa tumbuhan purba yang tertimbun jutaan tahun.</p>
    </div>
  </div>
  <div class="eg-soal-tumpuk" style="--miring:12deg;--geser:46px">
    <div class="eg-kartu eg-soal" style="box-shadow:0 0 0 6px var(--hutan), var(--bayang-kartu)">
      <div class="eg-soal__waktu"><img src="../../assets/Ikon/jam.svg" alt=""><div class="eg-bar eg-bar--tipis eg-isi"><i style="width:26%;--isi:var(--stempel)"></i></div><b class="eg-data" style="color:var(--stempel)">4</b></div>
      <img src="../../assets/Ikon/sda-batubara.svg" alt="" width="56" height="56" style="margin:18px auto 12px">
      <p class="eg-soal__teks">Batu bara terbentuk dari sisa tumbuhan purba yang tertimbun jutaan tahun.</p>
      <span class="eg-stempel eg-stempel--benar" style="position:absolute;top:70px;left:22px">Benar</span>
    </div>
  </div>
</div>
</body>
</html>
