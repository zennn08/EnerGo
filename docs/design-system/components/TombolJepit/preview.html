<!-- @dsCard group="HUD Tangkap" height=260 width=900 subtitle="Tombol tahan JEPIT dan meter RAD untuk Uranium" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Tombol jepit</title></head>
<body>
<div class="eg-kamera" style="display:flex;gap:40px;padding:32px 40px;align-items:center">
  <div class="eg-kolom" style="align-items:center"><div class="eg-jepit"><b>JEPIT</b></div><span class="eg-pil eg-pil--data" style="min-height:28px">diam</span></div>
  <div class="eg-kolom" style="align-items:center"><div class="eg-jepit is-ditekan"><i style="width:50px;height:50px"></i><b>JEPIT</b></div><span class="eg-pil eg-pil--data" style="min-height:28px">ditekan · 40%</span></div>
  <div class="eg-kolom" style="align-items:center"><div class="eg-jepit is-ditekan"><i style="width:104px;height:104px"></i><b>JEPIT</b></div><span class="eg-pil eg-pil--data" style="min-height:28px">hampir</span></div>
  <div class="eg-status" style="width:300px">
    <div class="eg-status__atas"><span class="eg-status__tag" style="background:var(--sda-uranium);color:var(--tinta)">RAD</span><span class="eg-status__teks">Sinyal menguat ↑</span></div>
    <div class="eg-baris" style="align-items:flex-end"><span class="eg-data" style="font-weight:700;font-size:40px;line-height:40px">74</span><div class="eg-isi"><div class="eg-bar eg-bar--tebal"><i style="width:74%;--isi:var(--sda-uranium)"></i></div></div></div>
  </div>
</div>
</body>
</html>
