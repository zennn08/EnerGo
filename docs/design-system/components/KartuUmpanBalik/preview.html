<!doctype html>
<html>
<head><meta charset="utf-8"><title>Kartu umpan balik</title></head>
<body>
<div class="eg-peta" style="display:flex;gap:40px;padding:44px 40px 32px;align-items:flex-start">
  <div class="eg-kartu eg-kartu--benar" style="width:380px">
    <div class="eg-selotip eg-selotip--hijau">Benar!</div>
    <span class="eg-chip eg-chip--benar" style="margin-top:6px"><img src="../../assets/Ikon/centang.svg" alt="">Pernyataan ini BENAR</span>
    <div class="eg-baris" style="align-items:flex-start;margin:14px 0"><img src="../../assets/Ikon/sda-batubara.svg" alt="" width="40" height="40"><p style="margin:0;font-size:18px;line-height:26px">Batu bara berasal dari tumbuhan rawa yang tertimbun dan termampatkan selama jutaan tahun.</p></div>
    <span class="eg-chip eg-chip--oker"><img src="../../assets/Ikon/sda-batubara.svg" alt="">+1 unit</span>
    <button class="eg-btn eg-btn--utama eg-btn--penuh" style="margin-top:16px">Soal berikutnya</button>
  </div>
  <div class="eg-kartu eg-kartu--salah" style="width:380px">
    <div class="eg-selotip eg-selotip--merah">Salah</div>
    <span class="eg-chip eg-chip--benar" style="margin-top:6px"><img src="../../assets/Ikon/centang.svg" alt="">Pernyataan ini BENAR</span>
    <div class="eg-baris" style="align-items:flex-start;margin:14px 0"><img src="../../assets/Ikon/sda-batubara.svg" alt="" width="40" height="40"><p style="margin:0;font-size:18px;line-height:26px">Batu bara berasal dari tumbuhan rawa yang tertimbun dan termampatkan selama jutaan tahun.</p></div>
    <button class="eg-btn eg-btn--nonaktif eg-btn--penuh" style="margin-top:8px;overflow:hidden" disabled>Baca dulu...<span class="eg-btn__isi" style="width:55%"></span></button>
  </div>
</div>
</body>
</html>
